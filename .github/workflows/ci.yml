name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_test
        options: >-
          --health-cmd "pg_isready -U school -d school_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql://school:school@localhost:5432/school_test
      TEST_DATABASE_URL: postgresql://school:school@localhost:5432/school_test
      SEED_DEMO_DATA: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Financial integrity suite
        run: npm test
      - name: Build
        run: npm run build
